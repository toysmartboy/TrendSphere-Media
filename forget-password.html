<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | TrendSphere Media</title>

    <!-- Website Icon -->
    <link
        rel="icon"
        href="assets/Images/icons/TrendSphere Media Logo ICON.jpg"
    >

    <!-- Website CSS -->
    <link
        rel="stylesheet"
        href="assets/CSS/style.css"
    >

    <link
        rel="stylesheet"
        href="assets/CSS/responsive.css"
    >

    <link
        rel="stylesheet"
        href="assets/CSS/darkmode.css"
    >

    <!-- Boxicons -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    >

</head>


<body>


    <!--===============================================
                    FORGOT PASSWORD PAGE
    ================================================-->

    <main class="auth-page">


        <div class="auth-container">


            <!--===========================================
                    FORGOT PASSWORD HEADER
            ===========================================-->

            <div class="auth-header">


                <a
                    href="index.html"
                    class="auth-logo"
                >

                    <img
                        src="assets/Images/Logos/TrendSphere Media Logo logo.png"
                        alt="TrendSphere Media"
                    >

                </a>


                <h1>
                    Forgot Your Password?
                </h1>


                <p>
                    Enter your email address and we'll
                    send you a link to reset your password.
                </p>


            </div>



            <!--===========================================
                    FORGOT PASSWORD FORM
            ===========================================-->

            <form
                id="forgot-password-form"
                class="auth-form"
            >


                <!-- EMAIL -->

                <div class="auth-input-group">

                    <label for="forgot-email">
                        Email Address
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-envelope"></i>


                        <input
                            type="email"
                            id="forgot-email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- MESSAGE -->

                <div
                    id="forgot-password-message"
                    class="auth-message"
                    role="alert"
                ></div>



                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    id="forgot-password-submit"
                    class="auth-submit"
                >

                    <i class="bx bx-mail-send"></i>

                    Send Reset Link

                </button>


            </form>



            <!--===========================================
                    AUTH FOOTER
            ===========================================-->

            <div class="auth-footer">


                <p>

                    Remember your password?

                    <a href="login.html">
                        Sign In
                    </a>

                </p>


                <p>

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>


                <a
                    href="index.html"
                    class="back-home"
                >

                    <i class="bx bx-arrow-back"></i>

                    Back to TrendSphere Media

                </a>


            </div>


        </div>


    </main>



    <!--===============================================
                    JAVASCRIPT
    ================================================-->

    <!-- Supabase -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Supabase Configuration -->

    <script
        src="assets/JavaScript/supabase.js"
    ></script>

    <script src="assets/JavaScript/data-cleanup.js"></script>
    <!-- Forgot Password -->

    <script
        src="assets/JavaScript/forgot-password.js"
    ></script>


</body>

</html>
