<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Create Account | TrendSphere Media </title>

    <!-- Website Icon -->
    <link rel="icon" href="assets/Images/icons/TrendSphere Media Logo ICON.jpg">
    <!-- Website CSS -->
    <link rel="stylesheet" href="assets/CSS/style.css">
    <link rel="stylesheet" href="assets/CSS/responsive.css">
    <link rel="stylesheet" href="assets/CSS/darkmode.css">
    <!-- Boxicons -->
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>

<body>

    <!--===============================================
                    REGISTER PAGE
    ================================================-->

    <main class="auth-page">


        <div class="auth-container">


            <!--===========================================
                    REGISTER HEADER
            ===========================================-->

            <div class="auth-header">

                <a
                    href="index.html"
                    class="auth-logo"
                >

                    <img
                        src="assets/Images/Logos/TrendSphere Media Logo logo.png"
                        alt="TrendSphere Media"
                    >

                </a>


                <h1>
                    Create Your Account
                </h1>


                <p>
                    Join TrendSphere Media and personalize
                    your news experience.
                </p>

            </div>



            <!--===========================================
                    REGISTER FORM
            ===========================================-->

            <form
                id="register-form"
                class="auth-form"
            >


                <!-- FULL NAME -->

                <div class="auth-input-group">

                    <label for="register-full-name">
                        Full Name
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-user"></i>

                        <input
                            type="text"
                            id="register-full-name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>



                <!-- USERNAME -->

                <div class="auth-input-group">

                    <label for="register-username">
                        Username
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-at"></i>

                        <input
                            type="text"
                            id="register-username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="auth-input-group">

                    <label for="register-email">
                        Email Address
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-envelope"></i>

                        <input
                            type="email"
                            id="register-email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="auth-input-group">

                    <label for="register-password">
                        Password
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-lock-alt"></i>

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-register-password"
                            aria-label="Show password"
                        >

                            <i class="bx bx-show"></i>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="auth-input-group">

                    <label for="register-confirm-password">
                        Confirm Password
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-lock-alt"></i>

                        <input
                            type="password"
                            id="register-confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-register-confirm-password"
                            aria-label="Show password"
                        >

                            <i class="bx bx-show"></i>

                        </button>

                    </div>

                </div>



                <!-- TERMS -->

                <label class="auth-checkbox">

                    <input
                        type="checkbox"
                        id="register-terms"
                        required
                    >

                    <span>
                        I agree to the TrendSphere Media
                        terms and privacy policy.
                    </span>

                </label>



                <!-- ERROR / SUCCESS MESSAGE -->

                <div
                    id="register-message"
                    class="auth-message"
                    role="alert"
                ></div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    id="register-submit"
                    class="auth-submit"
                >

                    <i class="bx bx-user-plus"></i>

                    Create Account

                </button>


            </form>



            <!--===========================================
                    LOGIN LINK
            ===========================================-->

            <div class="auth-footer">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Sign In
                    </a>

                </p>


                <a
                    href="index.html"
                    class="back-home"
                >

                    <i class="bx bx-arrow-back"></i>

                    Back to TrendSphere Media

                </a>

            </div>


        </div>

    </main>


</body>

    <!--===============================================
                    JAVASCRIPT
    ================================================-->
<!-- Supabase -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- TrendSphere Supabase Configuration -->

<script
    src="assets/JavaScript/supabase.js"
></script>

 <script src="assets/JavaScript/data-cleanup.js"></script>
<!-- Registration -->

<script
    src="assets/JavaScript/register.js"
></script>

<script src="assets/JavaScript/darkmode.js"></script>

</html>
