<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | TrendSphere Media</title>

    <!-- Website Icon -->
    <link
        rel="icon"
        href="assets/Images/icons/TrendSphere Media Logo ICON.jpg"
    >

    <!-- Website CSS -->
    <link
        rel="stylesheet"
        href="assets/CSS/style.css"
    >

    <link
        rel="stylesheet"
        href="assets/CSS/responsive.css"
    >

    <link
        rel="stylesheet"
        href="assets/CSS/darkmode.css"
    >

    <!-- Boxicons -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    >

</head>


<body>


    <!--===============================================
                    RESET PASSWORD PAGE
    ================================================-->

    <main class="auth-page">


        <div class="auth-container">


            <!--===========================================
                    RESET PASSWORD HEADER
            ===========================================-->

            <div class="auth-header">


                <a
                    href="index.html"
                    class="auth-logo"
                >

                    <img
                        src="assets/Images/Logos/TrendSphere Media Logo logo.png"
                        alt="TrendSphere Media"
                    >

                </a>


                <h1>
                    Create New Password
                </h1>


                <p>
                    Enter a new password for your
                    TrendSphere Media account.
                </p>


            </div>



            <!--===========================================
                    RESET PASSWORD FORM
            ===========================================-->

            <form
                id="reset-password-form"
                class="auth-form"
            >


                <!-- NEW PASSWORD -->

                <div class="auth-input-group">

                    <label for="reset-password">
                        New Password
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-lock-alt"></i>


                        <input
                            type="password"
                            id="reset-password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-reset-password"
                            aria-label="Show password"
                        >

                            <i class="bx bx-show"></i>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="auth-input-group">

                    <label for="reset-confirm-password">
                        Confirm New Password
                    </label>


                    <div class="auth-input">

                        <i class="bx bx-lock-alt"></i>


                        <input
                            type="password"
                            id="reset-confirm-password"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-reset-confirm-password"
                            aria-label="Show password"
                        >

                            <i class="bx bx-show"></i>

                        </button>

                    </div>

                </div>



                <!-- MESSAGE -->

                <div
                    id="reset-password-message"
                    class="auth-message"
                    role="alert"
                ></div>



                <!-- UPDATE BUTTON -->

                <button
                    type="submit"
                    id="reset-password-submit"
                    class="auth-submit"
                >

                    <i class="bx bx-lock-alt"></i>

                    Update Password

                </button>


            </form>



            <!--===========================================
                    AUTH FOOTER
            ===========================================-->

            <div class="auth-footer">


                <p>

                    Remember your password?

                    <a href="login.html">
                        Sign In
                    </a>

                </p>


                <a
                    href="index.html"
                    class="back-home"
                >

                    <i class="bx bx-arrow-back"></i>

                    Back to TrendSphere Media

                </a>


            </div>


        </div>


    </main>



    <!--===============================================
                    JAVASCRIPT
    ================================================-->

    <!-- Supabase -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Supabase Configuration -->

    <script
        src="assets/JavaScript/supabase.js"
    ></script>

 <script src="assets/JavaScript/data-cleanup.js"></script>
    <!-- Reset Password -->

    <script
        src="assets/JavaScript/reset-password.js"
    ></script>


</body>

</html>
